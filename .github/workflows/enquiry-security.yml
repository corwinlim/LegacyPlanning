name: Legacy Planning API Security Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run synthetic security regression tests
        run: node --test tests/*.test.js
